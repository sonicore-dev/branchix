[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "branchix"
dynamic = ["version"]
description = "Print a readable tree of directories and files in your terminal."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SoniCore", email = "its.saleem02@gmail.com" }]
keywords = ["tree", "directory", "cli", "filesystem", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "build", "twine"]

[project.scripts]
branchix = "branchix.cli:main"

[project.urls]
Homepage = "https://github.com/sonicore-dev/branchix"
Issues = "https://github.com/sonicore-dev/branchix/issues"
Changelog = "https://github.com/sonicore-dev/branchix/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/branchix/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/branchix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
